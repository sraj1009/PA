<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEE — local PA</title>
<style>
  :root { --bg:#0b0d10; --panel:#12161c; --line:#1f2630; --txt:#e8edf2; --dim:#8b98a5; --acc:#d7ff00; --err:#ff5c7c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 "Segoe UI",system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:14px 20px; border-bottom:1px solid var(--line);
           background:var(--panel); position:sticky; top:0; }
  .logo { font-weight:800; letter-spacing:3px; color:var(--acc); font-size:18px; }
  .sub { color:var(--dim); font-size:12px; }
  a.nav { margin-left:8px; font-size:12px; color:var(--dim); text-decoration:none; border:1px solid var(--line);
          padding:3px 10px; border-radius:99px; }
  a.nav:hover { color:var(--acc); border-color:var(--acc); }
  .pill { font-size:11px; color:var(--dim); border:1px solid var(--line); padding:3px 10px; border-radius:99px; }
  select.eng { margin-left:auto; background:#0e1218; color:var(--txt); border:1px solid var(--line);
               border-radius:8px; padding:4px 8px; font-size:12px; max-width:340px; cursor:pointer; }
  main { max-width:880px; margin:0 auto; padding:20px; }
  #log { display:flex; flex-direction:column; gap:14px; min-height:40vh; }
  .msg { border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:12px 14px; white-space:pre-wrap; word-break:break-word; }
  .msg.user { border-left:3px solid var(--acc); }
  .msg.bee { border-left:3px solid #4da3ff; }
  .msg.tool { font-size:12px; color:var(--dim); border-left:3px solid #39424e; background:#0e1218; }
  .msg.err { border-left:3px solid var(--err); color:var(--err); }
  .meta { font-size:11px; color:var(--dim); margin-top:8px; }
  .row { display:flex; gap:10px; margin-top:18px; }
  textarea { flex:1; background:#0e1218; color:var(--txt); border:1px solid var(--line); border-radius:10px;
             padding:12px; font:inherit; resize:vertical; min-height:56px; }
  button { border:1px solid var(--line); background:var(--panel); color:var(--txt); border-radius:10px;
           padding:0 18px; cursor:pointer; font:inherit; }
  button.primary { background:var(--acc); color:#0b0d10; font-weight:700; border:none; }
  button.rec { background:#3a1020; border-color:var(--err); color:var(--err); }
  .hint { color:var(--dim); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <span class="logo">BEE</span>
  <span class="sub">local-first self-improving PA</span>
  <a class="nav" href="/livekit" title="Realtime voice (agent must be running: python -m bee.cli livekit)">Live Voice</a>
  <a class="nav" href="/face" target="_blank" title="BEE's face — live state visualizer (F = fullscreen)">Face</a>
  <select class="eng" id="engine" title="BEE's brain — which model answers your tasks (choice is saved)"></select>
  <span class="pill" id="status">…</span>
</header>
<main>
  <div id="log"></div>
  <div class="row">
    <textarea id="task" placeholder="Give BEE a task…  (Enter = send, Shift+Enter = newline)"></textarea>
    <button class="rec" id="mic" title="Record voice command">🎙</button>
    <button class="primary" id="send">Send</button>
  </div>
  <div class="hint">Voice: click 🎙, speak, stop — BEE transcribes locally (faster-whisper) and replies. "cloud:" prefix forces the cloud model.</div>
</main>
<script>
const log = document.getElementById('log');
const taskEl = document.getElementById('task');
const status = document.getElementById('status');
function add(cls, text, meta) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  if (meta) { const m = document.createElement('div'); m.className='meta'; m.textContent=meta; d.appendChild(m); }
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
fetch('/health').then(r=>r.json()).then(h=>{
  status.textContent = h.ollama_models && h.ollama_models.length ? ('ollama: ' + h.ollama_models.slice(0,4).join(', ')) : 'ollama offline';
  if (!h.voice_stt) status.textContent += ' | voice STT not installed';
}).catch(()=>status.textContent='offline');

// engine (brain) selection — asked once, persisted server-side
let engineOverride = null;
async function loadEngine() {
  try {
    const j = await (await fetch('/engine')).json();
    const sel = document.getElementById('engine');
    sel.innerHTML = j.engines.map(e =>
      `<option value="${e.name}" ${e.name === j.current ? 'selected' : ''}>${e.name}</option>`).join('');
    const cur = j.engines.find(e => e.name === j.current) || j.engines[0];
    engineOverride = cur.override || null;
    sel.title = cur.label;
    sel.onchange = async () => {
      const r = await fetch('/engine', {method:'POST', headers:{'Content-Type':'application/json'},
                                        body: JSON.stringify({engine: sel.value})});
      const k = await r.json();
      engineOverride = k.override || null;
      const opt = sel.options[sel.selectedIndex];
      add('tool', 'engine → ' + sel.value + (k.error ? ' (error: ' + k.error + ')' : ' (saved)'));
    };
  } catch (e) { /* engine UI optional */ }
}
loadEngine();

async function send(task) {
  if (!task.trim()) return;
  add('user', task);
  const d = add('bee', 'thinking…');
  d.classList.add('busy');
  const res = await fetch('/chat', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({task, model: engineOverride})});
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', final = {output:'', model:'', escalated:false, iterations:0, tool_calls:0, ok:true, error:''};
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream:true});
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const line = buf.slice(0, i); buf = buf.slice(i+2);
      if (!line.startsWith('data: ')) continue;
      let ev; try { ev = JSON.parse(line.slice(6)); } catch(e){ continue; }
      if (ev.type === 'result') { final = ev; break; }
      if (ev.type === 'tool_call') add('tool', '→ ' + ev.tool + ' ' + JSON.stringify(ev.args||{}).slice(0,160));
      if (ev.type === 'tool_result') add('tool', (ev.ok?'✓':'✗') + ' ' + ev.tool + ' (' + ev.seconds + 's) ' + (ev.preview||'').slice(0,120));
    }
  }
  d.textContent = final.output || final.error || '(no output)';
  if (!final.ok) d.classList.add('err');
  d.classList.remove('busy');
  d.querySelector('.meta')?.remove();
  const m = document.createElement('div'); m.className='meta';
  m.textContent = `model=${final.model} ${final.escalated?'(escalated to cloud)':''} iters=${final.iterations} tools=${final.tool_calls}`;
  d.appendChild(m);
  log.scrollTop = log.scrollHeight;
}
document.getElementById('send').onclick = () => { send(taskEl.value); taskEl.value=''; };
taskEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(taskEl.value); taskEl.value=''; }
});

// voice recording
let mediaRec = null, chunks = [];
document.getElementById('mic').onclick = async function() {
  const btn = this;
  if (mediaRec && mediaRec.state === 'recording') { mediaRec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    chunks = [];
    mediaRec = new MediaRecorder(stream);
    mediaRec.ondataavailable = e => chunks.push(e.data);
    mediaRec.onstop = async () => {
      stream.getTracks().forEach(t=>t.stop());
      btn.classList.remove('rec'); btn.textContent = '🎙';
      const blob = new Blob(chunks, {type: mediaRec.mimeType || 'audio/webm'});
      add('user', '(voice)');
      const d = add('bee', 'transcribing locally…');
      const fd = new FormData(); fd.append('file', blob, 'voice.webm');
      const r = await fetch('/voice', {method:'POST', body: fd});
      const j = await r.json();
      d.textContent = (j.transcript ? '“' + j.transcript + '”\n\n' : '') + (j.output || j.error || '');
      if (j.error) d.classList.add('err');
    };
    mediaRec.start();
    btn.textContent = '⏹ stop';
  } catch(e) { add('err', 'mic error: ' + e.message); }
};
</script>
</body>
</html>
