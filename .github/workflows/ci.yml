# CI (Program Phase 7, 2026-10-08)
#
# Test categories (see tests/conftest.py) and what each job proves:
#   linux-core : CORE (bare install must not fail because optional packages
#                are absent) + SECURITY (permission/secret surface) +
#                portable INTEGRATION (no livekit room, no display, no
#                network — all network tests are hermetic: fake DNS resolver
#                and fake transport injected, e.g. tests/test_netguard.py).
#   windows-core: CORE + WINDOWS desktop/control — run ON Windows, never
#                emulated with fake assumptions in Linux CI.
#   ml         : the ML category under the PINNED stack (requirements-ml.txt)
#                — artifact metadata, per-class train report, load-time
#                compatibility, runtime fallback/latency telemetry.
#
# Voice / LiveKit live behavior requires real SDKs + hardware and is covered
# by the workflow_dispatch workflow (optional.yml), not by the default CI.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  linux-core:
    name: Linux — core + security + portable integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bare install (core requirements only)
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: CORE (must pass without optional deps)
        run: python -m pytest tests -q -m core
      - name: SECURITY
        run: python -m pytest tests -q -m security
      - name: Portable INTEGRATION (no livekit room / display / network)
        run: python -m pytest tests -q -m "integration and not livekit"

  windows-core:
    name: Windows — core + desktop/control
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bare install (core requirements only)
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: CORE
        run: python -m pytest tests -q -m core
      - name: WINDOWS desktop/control (on real Windows)
        run: python -m pytest tests -q -m windows

  ml:
    name: ML router (pinned stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core + PINNED ML stack
        run: >
          python -m pip install --upgrade pip &&
          python -m pip install -r requirements.txt -r requirements-ml.txt
      - name: ML category (router / pipeline / RAG / reproducibility)
        run: python -m pytest tests -q -m ml
      - name: Show ML router report
        run: python -m bee.brain.ml_report
