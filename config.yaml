# ============================================================
#  BEE configuration
# ============================================================

ollama:
  base_url: http://localhost:11434
  model: bee4b             # BEE's local model (Qwen2.5-3B base + BEE persona).
                            # ~1.9 GB, fits FULLY in the 4 GB GPU VRAM -> fast (no CPU offload).
                            # (qwen3:8b is ~5 GB and CPU-offloads on this card = slow;
                            #  qwen3:4b narrates reasoning in-content = wrong for a fast PA;
                            #  Qwen2.5 has no 4B size, so 3B is the best crisp+fast base.)
  embed_model: nomic-embed-text   # pull: ollama pull nomic-embed-text
  # 1024 per turn: agent-loop turns are short — long-form answers belong to the cloud tier.
  max_tokens: 1024
  temperature: 0.2
  timeout: 300
  # 8192 = the largest window that is both *sufficient* and *fully on-GPU*.
  # Measured 2026-10-13 with the real system prompt + the 30 shipped tool schemas:
  # a genuine agent turn is 5772-7339 tokens (10 model-using eval tasks, largest
  # call each), so 4096 made Ollama evaluate only
  # 2050 of them (29-35%) — the model answered without ever seeing its own tool
  # results. 8192 delivers 100% at 3.25-4.28 s/call. Above it the KV cache leaves
  # VRAM on this 4 GB card (/api/ps: 12288 -> 0.46 GB off-GPU, 16384 -> 0.61 GB),
  # which is where the "stays fully on-GPU" concern actually bites — at 8192 the
  # model is still entirely resident (size 2.31 GB == size_vram 2.31 GB).
  num_ctx: 8192
  keep_alive: "60s"        # unload the local model 60 s after last use ("" = Ollama's 5 min)
  # Start `ollama serve` at boot if nothing is answering base_url (BEE's own local
  # tier is otherwise silently skipped after a reboot). Background thread, never
  # blocks startup, never kills a server it did not start, localhost only.
  autostart: true

# Hybrid cloud fallback. Provider prefix formats (LiteLLM):
#   gemini/gemini-3.6-flash         (GOOGLE_API_KEY)  <- primary (verified live)
#   xai/grok-2-latest             (XAI_API_KEY)    fallback
#   openai/gpt-4o-mini            (OPENAI_API_KEY) key valid but account out of credits
# Credentials live in USER-SCOPE ENV VARS, not in this OneDrive-synced file.
cloud:
  enabled: true
  llm: "gemini/gemini-3.6-flash"
  api_key: ""              # env-var driven (OPENAI_API_KEY / GOOGLE_API_KEY / XAI_API_KEY)
  base_url: ""
  # P0-2: second provider for the SAME call when the primary hits a rate
  # limit / auth error / 5xx. The primary's provider is then skipped for
  # quota_cooldown seconds and calls go to fallback_llm (its own credentials:
  # fallback_api_key, else the provider env key). z.ai (GLM) = ZAI_API_KEY:
  #   zai/glm-5.3-flash   xai/grok-2-latest   deepseek/deepseek-chat
  fallback_llm: "zai/glm-5.3-flash"
  fallback_api_key: ""
  fallback_base_url: ""
  quota_cooldown: 900      # seconds to skip a provider kind after 429/auth/5xx
  max_tokens: 8192
  temperature: 0.3     # non-Gemini-3 cloud models only; Gemini 3+ omits it (Google:
                       # default 1.0 — temp<1.0 degrades reasoning + loops; see client.py)
  timeout: 180
  cloud_first: true        # hybrid engine: chat/QA goes to cloud first (fast, no
                           # local RAM load); local stays the automatic fallback.
                           # false = classic local-first hybrid.

voice:
  enabled: true
  model: base.en           # faster-whisper size: tiny.en | base.en | small.en | medium
  device: auto             # auto | cpu | cuda — this card is 4 GB (nvidia-smi 4094 MiB; memory/profile.md claims 8 GB, and tests/test_structured_memory.py:426 documents that conflict). int8 cuda is safe for tiny.en/base.en; small.en+ on 4 GB is unmeasured
  compute_type: int8
  sample_rate: 16000
  silence: 1.2             # seconds of quiet that ends a recording
  max_seconds: 90
  wake_word: bee
  speak: true
  speak_limit: 600         # max chars spoken aloud
  tts_rate: 190            # words/minute (pyttsx3); edge-tts % derived automatically
  tts_voice: ""            # "" = system default; else substring, e.g. "aria" (SAPI)
                           # or "en-US-AndrewMultilingualNeural" (edge-tts). /tts voices lists options
  edge_key: ""             # optional Azure key for edge-tts (higher quality voice)

sandbox:
  enabled: true
  image: bee-sandbox:latest
  gpu: true                # requires NVIDIA driver + `docker run --gpus all` support
  workdir: /workspace      # host workspace is mounted here
  timeout: 300
  max_output: 12000

scheduler:
  enabled: true
  consolidate_cron: "0 3 * * *"   # nightly memory consolidation at 03:00

guard:
  enabled: true
  mode: cli          # cli (prompt) | unattended (auto-deny). "always" is REFUSED at load (falls back to cli).

privacy:
  redact_cloud: true # PII (email/phone/card/keys/Aadhaar/secrets) redacted before CLOUD calls; local never redacted

router:
  ml_enabled: true       # learned router (bee/brain/mlrouter.py) fuses with heuristics
  ml_min_episodes: 150   # minimum labeled episodes before the ML tier may decide
  ml_confidence: 0.70    # minimum predicted confidence for the ML tier to override heuristics

rag:
  auto_context: true     # inject grounded memory context when a task references past state
  k: 4                   # chunks injected

monitor:
  enabled: true          # metrics.jsonl event stream + dashboard (/dashboard)

# "Welcome Home" workspace protocol (Super JARVIS port) — /welcome, "welcome home",
# or double-clap (clap.action: welcome). Retrigguard blocks rapid re-runs.
welcome:
  enabled: true
  user: "Mshri"
  retrigger_s: 60
  song_uri: ""                        # Spotify/YouTube track URL ("" = skip song)
  urls:                               # each opens in a FRESH Chrome window, snapped to a monitor
    - { url: "https://aistudio.google.com/app/apps", monitor: 1, fullscreen: true }
    - { url: "https://grok.com", monitor: 2, fullscreen: false }
  focus_ide: true                     # foreground existing Accio Work window (launch if missing)
  ide_fullscreen: false               # send F11 to the app after focus
  ide_name: "Accio Work"              # label used in step messages
  ide_exes: ["accio.exe"]             # process executable(s) to match for the main window
  ide_path: 'C:\Users\mshri\AppData\Local\Programs\Accio\Accio.exe'   # launch target if no window is running

# LiveKit Cloud — LIVE realtime voice ("backtalk": hold-to-talk, agent answers in ~1s).
# Free tier (~1000 agent-minutes/month). Secrets come from .env:
#   LIVEKIT_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET
# Agent:   python -m bee.cli livekit [--room bee-pa]     (run while you talk)
# Join:    open the Web UI -> "Live Voice" tab -> Join  (mic + speakers)
livekit:
  enabled: true
  room: "bee-pa"
  stt_lang: "en"
  # TTS voice for live voice is set under voice.tts_voice (edge-tts neural,
  # e.g. "en-US-AndrewMultilingualNeural"); pyttsx3 offline WAV is the fallback.

# Personalization — who BEE serves (drives the "Who I serve" prompt block)
user:
  name: "Mshri"
  timezone: "Asia/Calcutta"  # IST
  region: "IN"
  interests:
    - AI / ML & LLMs
    - Full-stack web development
    - Systems & automation

# Double-clap acoustic trigger (Super JARVIS port) — python -m bee.cli clap
clap:
  action: welcome          # welcome | voice (record one utterance, run it as a task)
  sample_rate: 44100
  block_ms: 40
  spike_ratio: 7.0         # clap = RMS > max(noise_floor*7, min_rms)
  min_rms: 0.012
  min_gap: 0.06            # two claps closer than this = one clap's reverb
  max_gap: 0.40            # two claps farther apart = two singles
  cooldown: 1.5
  retrigger_ratio: 0.55    # hysteresis: audio must drop below 55% of threshold to re-arm
  warmup_s: 1.5            # mic calibration window

# Proactive event sources (bee/automation/events.py -> start_sources).
# These publish EVENTS only — an event can never cause an action unless a
# user-authorized proactive rule matches it (default-deny, rate-limited).
# Every key here is read by start_sources; adding one without wiring it there
# is the dead-switch defect the 2026-10-08 audit recorded.
automation:
  enabled: true                # false = no durable jobs at all
  events_enabled: true         # false = no polling event sources
  event_tick_seconds: 60       # heartbeat rules can match
  battery_poll_seconds: 60     # battery.low / unplugged / charged
  battery_low_percent: 20      # fires at/below this while on battery
  network_poll_seconds: 30     # network.down / network.restored (TCP, no DNS)
  app_events: true             # app.focused / app.launched / app.closed (Windows)
  app_poll_seconds: 10
  file_watch_dir: ""           # set a path to enable file.changed polling
  device_events: true          # device.memory_low / disk_low transitions
  device_poll_seconds: 60
  memory_low_mb: 1500          # warn below this free RAM (this box stalls under ~1.5 GB)
  disk_low_gb: 4               # warn below this free space on the system drive

# Self-improvement flywheel (bee/agent/reflection.py, called by the kernel after
# every non-trivial task on EVERY surface — REPL, web, voice, jobs, proactive).
# A lesson is written to memory/lessons/<date>.md and `context.recent_lessons()`
# injects it into every future system prompt, so it is an operator-facing switch.
# Cost: one extra local-model call per non-trivial task. Read by
# AgentKernel._reflect; the eval turns it off to keep scored runs deterministic.
learning:
  reflect: true                # false = never write or spend a reflection call
  # P1: plan-first execution. Multi-step tasks (and requests that ask for a
  # plan) get an explicit plan from the local planner tool BEFORE the loop
  # starts, injected into the working context — the 3B follows numbered steps
  # far better than it invents them mid-task. One local call per qualifying
  # task; deterministic tiers never reach it. Gated on a real LLMClient, so
  # scripted tests see an untouched call sequence (same rule as critique).
  plan_first: true

# J3 — model-upgrade quality gate (bee.evals.gate; nightly `model_gate` job,
# manual run: /gate in the REPL). After a training run + merge + `ollama create`,
# set `candidate` to the new local model. The gate seeds the ACTIVE model's
# baseline (one full eval run), scores the candidate, and promotes it — by
# writing models.yaml (local_model) — only when it beats the baseline by
# `margin` with no structural regressions.
model_gate:
  enabled: true
  candidate: "bee4b-v2"        # SFT adapter 2026-10-17 (merged -> Q4_K_M gguf)
  margin: 1
  # P0-5: tasks the two arms disagree on are re-run this many EXTRA times per
  # side; majority decides (one flaky task can no longer flip a verdict).
  adjudication_rounds: 2

# P0-5: nightly self-improvement chain. auto_qlora (opt-in) trains nightly on
# train/sft_v1.jsonl; after a successful run the adapter is merged, GGUF-
# converted + Q4_K_M-quantized and imported into Ollama when llama_cpp_dir
# points at an unpacked llama.cpp (convert_hf_to_gguf.py at its root,
# llama-quantize*.exe alongside) — and the finished model is queued for the
# J3 gate (train/gate_candidate.json): no hand-edited candidate needed.
# The path below is the unpacked b11711 release+source used for bee4b-v2;
# move llama.cpp somewhere stable and update it (empty = merge-only).
training:
  auto_qlora: false
  llama_cpp_dir: "C:/Users/mshri/AppData/Local/Temp/opencode/llamacpp"
